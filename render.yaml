services:
  - type: web
    name: student-portal
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: student-portal-db
          property: connectionString

databases:
  - name: student-portal-db
    databaseName: student_portal
    user: student_portal_user
    plan: free

